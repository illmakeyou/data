<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클래식 테트리스 (Tetris)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="tetris-wrapper">
      <div class="board-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        <div id="overlay" class="overlay">
          <div id="overlay-msg">게임 시작</div>
          <button id="start-btn">시작 (Enter)</button>
        </div>
      </div>

      <div class="sidebar">
        <div class="info-card">
          <h2>다음 블록</h2>
          <canvas id="next" width="96" height="96"></canvas>
        </div>

        <div class="info-card">
          <div class="stat-item">
            <span class="label">점수</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="stat-item">
            <span class="label">줄 수</span>
            <span id="lines" class="value">0</span>
          </div>
          <div class="stat-item">
            <span class="label">레벨</span>
            <span id="level" class="value">1</span>
          </div>
        </div>

        <div class="info-card controls-guide">
          <h3>조작법</h3>
          <ul>
            <li><span>⬅️ / ➡️</span> : 좌우 이동</li>
            <li><span>⬆️</span> : 블록 회전</li>
            <li><span>⬇️</span> : 소프트 드롭</li>
            <li><span>Space</span> : 하드 드롭</li>
            <li><span>P</span> : 일시 정지</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
